<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1d2129" />
    <title>Atem</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atem" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Design: Wie das Gerät (Standard), Dunkel oder Hell – dieselbe Regel wie src/lib/theme.ts
      (function () {
        var c = "system";
        try { c = localStorage.getItem("atem:theme") || "system"; } catch (e) {}
        var t = c === "light" ? "light" : c === "dark" ? "dark" : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "light" ? "#f4f4f6" : "#1d2129");
        document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute("content", t === "light" ? "default" : "black-translucent");
      })();
    </script>
    <style>
      html { background: #1d2129; }
      html[data-theme="light"] { background: #f4f4f6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
