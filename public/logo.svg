<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b6bff"/>
      <stop offset=".55" stop-color="#6d4aff"/>
      <stop offset="1" stop-color="#3b1fb8"/>
    </linearGradient>
    <radialGradient id="petal" cx="50%" cy="85%" r="80%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <g transform="translate(64 66)">
    <g opacity=".9">
      <ellipse cx="0" cy="-20" rx="12" ry="22" fill="url(#petal)"/>
      <ellipse cx="0" cy="-20" rx="12" ry="22" fill="url(#petal)" transform="rotate(60)"/>
      <ellipse cx="0" cy="-20" rx="12" ry="22" fill="url(#petal)" transform="rotate(120)"/>
      <ellipse cx="0" cy="-20" rx="12" ry="22" fill="url(#petal)" transform="rotate(180)"/>
      <ellipse cx="0" cy="-20" rx="12" ry="22" fill="url(#petal)" transform="rotate(240)"/>
      <ellipse cx="0" cy="-20" rx="12" ry="22" fill="url(#petal)" transform="rotate(300)"/>
    </g>
    <circle r="7" fill="#fff"/>
  </g>
</svg>
